name: Checks and publication
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  macos:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: cargo test --locked
      - run: npm run build
      - run: npm test
  ci:
    if: always()
    needs: [rust, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "$RUST_RESULT" = success && test "$MACOS_RESULT" = success
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
      - name: "Validated main pull request #${{ github.event.pull_request.number }}"
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: "true"
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm run build
      - run: npm test
      - name: Pack and publish native package then launcher with OIDC provenance
        run: |
          mkdir -p dist
          npm pack ./packages/darwin-arm64 --ignore-scripts --pack-destination dist
          npm pack --ignore-scripts --pack-destination dist
          version=$(node -p 'require("./package.json").version')
          for variant in -darwin-arm64 ''; do
            package="@sebastienelet/herdr-worktree-cleanup$variant"
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/${package/\//%2F}/$version")
            case "$status" in
              404) npm publish "dist/sebastienelet-herdr-worktree-cleanup$variant-$version.tgz" --provenance --access public --registry https://registry.npmjs.org --ignore-scripts ;;
              200) echo "$package@$version exists; inspect integrity and provenance before resuming." >&2; exit 1 ;;
              *) echo "Cannot check $package@$version: HTTP $status" >&2; exit 1 ;;
            esac
          done
